apiVersion: v1
kind: Service
metadata:
  name: health-dashboard
  namespace: health
  labels:
    app.kubernetes.io/name: health-dashboard
  annotations:
    metallb.universe.tf/address-pool: homelab-pool
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.178.216
  loadBalancerSourceRanges:
    - 192.168.178.0/24
  selector:
    app.kubernetes.io/name: health-dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
