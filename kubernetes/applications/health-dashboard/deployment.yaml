apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-dashboard
  namespace: health
  labels:
    app.kubernetes.io/name: health-dashboard
    app.kubernetes.io/part-of: health-observability
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: health-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: health-dashboard
        app.kubernetes.io/part-of: health-observability
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: health-dashboard
          image: ghcr.io/ali-fathi/health-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: health-dashboard-config
            - secretRef:
                name: health-dashboard-secrets
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
