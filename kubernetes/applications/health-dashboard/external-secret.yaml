apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: health-dashboard-secrets
  namespace: health
spec:
  # The Health Dashboard credentials rarely change.
  # A 48-hour refresh reduces unnecessary Azure Key Vault reads.
  refreshInterval: 48h

  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore

  target:
    name: health-dashboard-secrets
    creationPolicy: Owner

  data:
    - secretKey: INFLUXDB_USERNAME
      remoteRef:
        key: garmin-influxdb-username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: INFLUXDB_PASSWORD
      remoteRef:
        key: garmin-influxdb-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
