apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: health-dashboard-secrets
  namespace: health
spec:
  # These credentials are static. Sync on creation or an explicit metadata/spec
  # change (for example, a deliberate force-sync), not on a periodic poll.
  refreshPolicy: OnChange

  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore

  target:
    name: health-dashboard-secrets
    creationPolicy: Owner

  data:
    - secretKey: INFLUXDB_USERNAME
      remoteRef:
        key: garmin-influxdb-username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: INFLUXDB_PASSWORD
      remoteRef:
        key: garmin-influxdb-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: DASHBOARD_USERNAME
      remoteRef:
        key: health-dashboard-auth-username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: DASHBOARD_PASSWORD_HASH
      remoteRef:
        key: health-dashboard-auth-password-hash
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: FLASK_SECRET_KEY
      remoteRef:
        key: health-dashboard-flask-secret-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
