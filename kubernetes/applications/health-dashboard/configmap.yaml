apiVersion: v1
kind: ConfigMap
metadata:
  name: health-dashboard-config
  namespace: health
data:
  INFLUXDB_HOST: garmin-influxdb.garmin.svc.cluster.local
  INFLUXDB_PORT: "8086"
  INFLUXDB_DATABASE: GarminStats
  VM_URL: http://victoriametrics.ring-health.svc.cluster.local:8428
  RING_DEVICE: colmi_r02
  MOCK_DATA: "false"
  PYTHONUNBUFFERED: "1"
  DB_TIMEOUT_SECONDS: "5"
  SESSION_LIFETIME_HOURS: "8"
  AUTH_MAX_ATTEMPTS: "5"
  AUTH_ATTEMPT_WINDOW_SECONDS: "300"
  # Change to true after the dashboard is served to browsers over HTTPS.
  SESSION_COOKIE_SECURE: "true"
