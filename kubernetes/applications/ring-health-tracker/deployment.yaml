apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriametrics
  namespace: ring-health
  labels:
    app.kubernetes.io/name: victoriametrics
    app.kubernetes.io/part-of: ring-health-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: victoriametrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoriametrics
        app.kubernetes.io/part-of: ring-health-tracker
    spec:
      securityContext:
        fsGroup: 65534

      containers:
        - name: victoriametrics
          image: victoriametrics/victoria-metrics:v1.119.0
          imagePullPolicy: IfNotPresent

          args:
            - "-storageDataPath=/storage"
            - "-retentionPeriod=12"
            - "-httpListenAddr=:8428"

          ports:
            - name: http
              containerPort: 8428

          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: data
              mountPath: /storage

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: victoriametrics-data
