apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garmin-influxdb-data
  namespace: garmin
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garmin-influxdb
  namespace: garmin
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: garmin-influxdb

  template:
    metadata:
      labels:
        app: garmin-influxdb

    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"

      initContainers:
        - name: init-influxdb-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Preparing InfluxDB data directory..."
              mkdir -p /var/lib/influxdb/meta
              mkdir -p /var/lib/influxdb/data
              mkdir -p /var/lib/influxdb/wal
              chown -R 1000:1000 /var/lib/influxdb
              chmod -R 775 /var/lib/influxdb
              echo "InfluxDB data directory permissions fixed."
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/influxdb

      containers:
        - name: influxdb
          image: influxdb:1.11
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8086

          env:
            - name: INFLUXDB_DB
              value: GarminStats

            - name: INFLUXDB_USER
              valueFrom:
                secretKeyRef:
                  name: garmin-secrets
                  key: INFLUXDB_USERNAME

            - name: INFLUXDB_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: garmin-secrets
                  key: INFLUXDB_PASSWORD

            - name: INFLUXDB_DATA_INDEX_VERSION
              value: tsi1

          readinessProbe:
            httpGet:
              path: /ping
              port: 8086
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /ping
              port: 8086
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 5

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

          volumeMounts:
            - name: data
              mountPath: /var/lib/influxdb

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: garmin-influxdb-data
---
apiVersion: v1
kind: Service
metadata:
  name: garmin-influxdb
  namespace: garmin
spec:
  type: ClusterIP

  selector:
    app: garmin-influxdb

  ports:
    - name: http
      port: 8086
      targetPort: 8086