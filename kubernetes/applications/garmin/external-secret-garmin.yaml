apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garmin-secrets
  namespace: garmin
spec:
  # Cost optimization:
  # Garmin credentials and InfluxDB credentials rarely change.
  # These credentials are static. Sync on creation or an explicit metadata/spec
  # change (for example, a deliberate force-sync), not on a periodic poll.
  refreshPolicy: OnChange

  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore

  target:
    name: garmin-secrets
    creationPolicy: Owner

  data:
    - secretKey: GARMINCONNECT_EMAIL
      remoteRef:
        key: garmin-connect-email
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: GARMINCONNECT_BASE64_PASSWORD
      remoteRef:
        key: garmin-connect-password-base64
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: INFLUXDB_USERNAME
      remoteRef:
        key: garmin-influxdb-username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: INFLUXDB_PASSWORD
      remoteRef:
        key: garmin-influxdb-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
