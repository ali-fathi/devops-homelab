apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-longhorn
  namespace: nginx-storage-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-longhorn
  template:
    metadata:
      labels:
        app: nginx-longhorn
    spec:
      initContainers:
        - name: init-html
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ ! -f /data/index.html ]; then
                echo "<h1>Nginx with Longhorn Storage and MetalLB</h1>" > /data/index.html
                echo "<p>This page is served by Nginx.</p>" >> /data/index.html
                echo "<p>The HTML file is stored on a Longhorn Persistent Volume.</p>" >> /data/index.html
                echo "<p>The application is exposed using a MetalLB LoadBalancer IP.</p>" >> /data/index.html
                echo "<p>Namespace: nginx-storage-demo</p>" >> /data/index.html
                echo "<p>Created at: $(date)</p>" >> /data/index.html
              fi
          volumeMounts:
            - name: nginx-html
              mountPath: /data

      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-html
              mountPath: /usr/share/nginx/html

      volumes:
        - name: nginx-html
          persistentVolumeClaim:
            claimName: nginx-html-pvc
