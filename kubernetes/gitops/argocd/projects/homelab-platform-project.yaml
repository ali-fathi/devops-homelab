apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab-platform
  namespace: argocd
spec:
  description: Homelab platform and observability workloads

  sourceRepos:
    - https://github.com/ali-fathi/devops-homelab.git
    # External Helm chart repos for the observability stack (Argo CD helm source)
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts

  destinations:
    - namespace: garmin
      server: https://kubernetes.default.svc

    - namespace: monitoring
      server: https://kubernetes.default.svc

    # kube-prometheus-stack creates control-plane Service objects here.
    - namespace: kube-system
      server: https://kubernetes.default.svc

    - namespace: logging
      server: https://kubernetes.default.svc

    - namespace: external-secrets-system
      server: https://kubernetes.default.svc

    - namespace: argocd
      server: https://kubernetes.default.svc

    - namespace: ring-health
      server: https://kubernetes.default.svc

    - namespace: health
      server: https://kubernetes.default.svc

  # Observability charts create these cluster-scoped resources.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
