apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: health-dashboard
  namespace: argocd
spec:
  project: homelab-platform

  source:
    repoURL: https://github.com/ali-fathi/devops-homelab.git
    targetRevision: main
    path: kubernetes/applications/health-dashboard

  destination:
    server: https://kubernetes.default.svc
    namespace: health

  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
