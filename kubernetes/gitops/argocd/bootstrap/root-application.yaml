apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-applications
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homelab-platform
    app.kubernetes.io/component: gitops-root
spec:
  project: homelab-platform

  source:
    repoURL: https://github.com/ali-fathi/devops-homelab.git
    targetRevision: main
    path: kubernetes/gitops/argocd/applications

    directory:
      include: "{*.yaml,*.yml}"
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true

    syncOptions:
      - ServerSideApply=true
