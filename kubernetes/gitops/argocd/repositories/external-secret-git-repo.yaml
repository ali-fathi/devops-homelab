apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-repo-devops-homelab
  namespace: argocd
spec:
  refreshInterval: 48h

  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore

  target:
    name: argocd-repo-devops-homelab
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/ali-fathi/devops-homelab.git
        username: "{{ .username }}"
        password: "{{ .password }}"

  data:
    - secretKey: username
      remoteRef:
        key: github-username

    - secretKey: password
      remoteRef:
        key: github-token
