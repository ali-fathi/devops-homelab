deploymentMode: SingleBinary

loki:
  auth_enabled: false

  server:
    log_level: warn

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
      admin: loki-admin

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    retention_period: 720h
    reject_old_samples: true
    reject_old_samples_max_age: 168h

  compactor:
    retention_enabled: true
    delete_request_store: filesystem

  rulerConfig:
    enable_api: true
    enable_alertmanager_v2: true

    alertmanager_url: http://monitoring-kube-prometheus-alertmanager.monitoring.svc.cluster.local:9093

    evaluation_interval: 1m

    storage:
      type: local
      local:
        directory: /var/loki/rules

    rule_path: /tmp/loki-rules

    ring:
      kvstore:
        store: inmemory

singleBinary:
  replicas: 1

  persistence:
    enabled: true
    storageClass: longhorn
    size: 20Gi

  extraVolumes:
    - name: loki-alert-rules
      configMap:
        name: loki-log-alert-rules

  extraVolumeMounts:
    - name: loki-alert-rules
      mountPath: /var/loki/rules/fake
      readOnly: true

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

gateway:
  enabled: true

read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

chunksCache:
  enabled: false

resultsCache:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: true

test:
  enabled: false