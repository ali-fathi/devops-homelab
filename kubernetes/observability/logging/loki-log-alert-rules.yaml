apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-log-alert-rules
  namespace: logging

data:
  log-alerts.yaml: |
    groups:
      - name: critical-log-alerts
        interval: 1m

        rules:

          # ------------------------------------------------------------
          # Critical application logs
          # Excludes observability/system/debug namespaces and known self-query noise.
          # ------------------------------------------------------------
          - alert: LokiCriticalApplicationLogsDetected
            expr: |
              sum by (namespace, pod, container) (
                count_over_time(
                  {
                    namespace!="",
                    namespace!="logging",
                    namespace!="monitoring",
                    namespace!="kube-system",
                    namespace!="longhorn-system",
                    namespace!="external-secrets-system",
                    pod!~".*netshoot.*|.*curl-test.*|.*debug.*|.*test.*"
                  }
                  |~ "(?i)critical|fatal|panic|segmentation fault|segfault|data corruption|corruption detected"
                  !~ "(?i)(logger=tsdb.loki|endpoint=queryData|lokiPath=/loki/api/v1/query|/loki/api/v1/query|/loki/api/v1/query_range|GET /loki/api/v1/query|GET /loki/api/v1/query_range|query=|supportingQueryType|Response received from loki|Grafana/[0-9]|dashboard.grafana.app|/apis/dashboard.grafana.app|/api/dashboards|homelab-loki-critical-error|logger=context|logger=live|Initialized channel handler|Request Completed|statusCode=200|status=200|status=201|status=204|status=304|status=400|status=404|source=loki_ruler|rule_type=alerting|executing query|request timings|context canceled|tail client|grpc tail client|client-side throttling|failed to register collector with remote server|noop client|remotecfg)"
                  [5m]
                )
              ) > 0
            for: 2m
            labels:
              severity: critical
              source: loki
              category: application
            annotations:
              summary: "Critical application log detected"
              description: "Critical/fatal/panic log detected in namespace={{ $labels.namespace }}, pod={{ $labels.pod }}, container={{ $labels.container }}."

          # ------------------------------------------------------------
          # OOM / memory exhaustion logs
          # Excludes Loki Gateway/Grafana query strings that only contain the OOM keywords.
          # ------------------------------------------------------------
          - alert: LokiOOMDetected
            expr: |
              sum by (namespace, pod, container) (
                count_over_time(
                  {
                    namespace!="",
                    pod!~".*netshoot.*|.*curl-test.*|.*debug.*|.*test.*|loki-gateway.*",
                    container!="nginx"
                  }
                  |~ "(?i)oomkilled|out of memory|oom killer|memory cgroup out of memory|cannot allocate memory"
                  !~ "(?i)(logger=tsdb.loki|endpoint=queryData|lokiPath=/loki/api/v1/query|/loki/api/v1/query|/loki/api/v1/query_range|GET /loki/api/v1/query|GET /loki/api/v1/query_range|query=|supportingQueryType|Response received from loki|Grafana/[0-9]|dashboard.grafana.app|/apis/dashboard.grafana.app|/api/dashboards|homelab-loki-critical-error|logger=context|logger=live|Initialized channel handler|Request Completed|statusCode=200|status=200|status=201|status=204|status=304|status=400|status=404|source=loki_ruler|rule_type=alerting|executing query|request timings|context canceled|tail client|grpc tail client|client-side throttling|failed to register collector with remote server|noop client|remotecfg)"
                  [5m]
                )
              ) > 0
            for: 1m
            labels:
              severity: critical
              source: loki
              category: kubernetes
            annotations:
              summary: "OOM or memory exhaustion detected"
              description: "OOM or memory exhaustion detected in namespace={{ $labels.namespace }}, pod={{ $labels.pod }}, container={{ $labels.container }}."

          # ------------------------------------------------------------
          # Longhorn critical storage issues only
          # ------------------------------------------------------------
          - alert: LokiLonghornCriticalStorageLogsDetected
            expr: |
              sum by (namespace, pod, container) (
                count_over_time(
                  {namespace="longhorn-system"}
                  |~ "(?i)volume .* degraded|volume .* faulted|replica .* failed|replica failure|failed to attach|failed to detach|disk pressure|no available disk|insufficient storage|filesystem is read-only|input/output error"
                  !~ "(?i)(logger=tsdb.loki|endpoint=queryData|/loki/api/v1/query|/loki/api/v1/query_range|GET /loki/api/v1/query|GET /loki/api/v1/query_range|query=|Response received from loki|dashboard.grafana.app|source=loki_ruler|rule_type=alerting|executing query|request timings|context canceled|tail client|grpc tail client)"
                  [5m]
                )
              ) > 0
            for: 2m
            labels:
              severity: critical
              source: loki
              component: longhorn
              category: storage
            annotations:
              summary: "Critical Longhorn storage log detected"
              description: "Critical Longhorn storage issue detected in pod={{ $labels.pod }}, container={{ $labels.container }}."

          # ------------------------------------------------------------
          # Grafana real critical logs only
          # Ignores dashboard/API request noise and successful datasource queries.
          # ------------------------------------------------------------
          - alert: LokiGrafanaCriticalLogsDetected
            expr: |
              sum by (namespace, pod, container) (
                count_over_time(
                  {namespace="monitoring", pod=~".*grafana.*"}
                  !~ "(?i)(logger=tsdb.loki|endpoint=queryData|Response received from loki|dashboard.grafana.app|/apis/dashboard.grafana.app|/api/dashboards|homelab-loki-critical-error|logger=context|logger=live|Initialized channel handler|Request Completed|status=200|status=201|status=204|status=304|status=400|status=404)"
                  | logfmt
                  | level=~"error|fatal|panic"
                  [5m]
                )
              ) > 0
            for: 2m
            labels:
              severity: critical
              source: loki
              component: grafana
              category: observability
            annotations:
              summary: "Critical Grafana log detected"
              description: "Grafana emitted a real error/fatal/panic log in pod={{ $labels.pod }}, container={{ $labels.container }}."

          # ------------------------------------------------------------
          # Grafana HTTP 5xx only
          # Ignores normal 400/401/403/404 and dashboard import/query noise.
          # ------------------------------------------------------------
          - alert: LokiGrafanaHTTP5xxDetected
            expr: |
              sum by (namespace, pod, container) (
                count_over_time(
                  {namespace="monitoring", pod=~".*grafana.*"}
                  |~ "status=5[0-9][0-9]"
                  !~ "(?i)(logger=tsdb.loki|endpoint=queryData|Response received from loki|dashboard.grafana.app|/apis/dashboard.grafana.app|/api/dashboards|homelab-loki-critical-error)"
                  [5m]
                )
              ) > 0
            for: 3m
            labels:
              severity: critical
              source: loki
              component: grafana
              category: observability
            annotations:
              summary: "Grafana HTTP 5xx detected"
              description: "Grafana returned HTTP 5xx in pod={{ $labels.pod }}, container={{ $labels.container }}."

          # ------------------------------------------------------------
          # Loki internal critical logs only
          # IMPORTANT: restricted to the real Loki container, not loki-gateway nginx.
          # ------------------------------------------------------------
          - alert: LokiInternalCriticalLogsDetected
            expr: |
              sum by (namespace, pod, container) (
                count_over_time(
                  {namespace="logging", pod=~"loki-.*", container="loki"}
                  |~ "(?i)panic|fatal|critical|failed to start|out of space|permission denied|corruption"
                  !~ "(?i)(source=loki_ruler|rule_type=alerting|evaluating rule|executing query|request timings|caller=metrics.go|caller=engine.go|caller=evaluator_local.go|caller=compat.go|scheduler_processor.go|tail.go|http.go|Error receiving response from grpc tail client|Error from iterator|reached tail max duration limit|context canceled|rpc error: code = Canceled|err=EOF|tail client|grpc tail client|client-side throttling|failed to register collector with remote server|remotecfg|noop client|memcache: no servers configured or available|failed to lookup SRV records)"
                  [5m]
                )
              ) > 0
            for: 2m
            labels:
              severity: critical
              source: loki
              component: loki
              category: observability
            annotations:
              summary: "Critical Loki internal log detected"
              description: "Critical Loki internal issue detected in pod={{ $labels.pod }}, container={{ $labels.container }}."

          # ------------------------------------------------------------
          # Real Loki Gateway 5xx burst
          # This replaces false critical/OOM alerts from nginx access logs.
          # ------------------------------------------------------------
          - alert: LokiGatewayHTTP5xxBurstDetected
            expr: |
              sum by (namespace, pod, container) (
                count_over_time(
                  {namespace="logging", pod=~"loki-gateway.*", container="nginx"}
                  |~ " 5[0-9][0-9] "
                  [10m]
                )
              ) > 10
            for: 5m
            labels:
              severity: critical
              source: loki
              component: loki-gateway
              category: observability
            annotations:
              summary: "Loki Gateway HTTP 5xx burst detected"
              description: "More than 10 Loki Gateway HTTP 5xx responses detected in pod={{ $labels.pod }}, container={{ $labels.container }} during the last 10 minutes."

          # ------------------------------------------------------------
          # Grafana Alloy critical logs only
          # Excludes known harmless Alloy/Kubernetes throttling and remotecfg noise.
          # ------------------------------------------------------------
          - alert: LokiAlloyCriticalLogsDetected
            expr: |
              sum by (namespace, pod, container) (
                count_over_time(
                  {namespace="logging", pod=~".*alloy.*"}
                  |~ "(?i)panic|fatal|critical|failed to start|configuration error|invalid config"
                  !~ "(?i)(client-side throttling|failed to register collector with remote server|remotecfg|noop client|source=loki_ruler|rule_type=alerting|executing query|request timings|context canceled|tail client)"
                  [5m]
                )
              ) > 0
            for: 2m
            labels:
              severity: critical
              source: loki
              component: alloy
              category: observability
            annotations:
              summary: "Critical Grafana Alloy log detected"
              description: "Critical Alloy issue detected in pod={{ $labels.pod }}, container={{ $labels.container }}."

          # ------------------------------------------------------------
          # Logging namespace critical logs
          # Excludes loki-gateway nginx access logs and known cancellation/noise.
          # ------------------------------------------------------------
          - alert: LokiLoggingStackCriticalLogsDetected
            expr: |
              sum by (namespace, pod, container) (
                count_over_time(
                  {
                    namespace="logging",
                    container!="nginx",
                    pod!~"loki-gateway.*|loki-canary.*"
                  }
                  |~ "(?i)panic|fatal|critical|failed to start|corruption|out of space|permission denied"
                  !~ "(?i)(source=loki_ruler|rule_type=alerting|evaluating rule|executing query|request timings|caller=metrics.go|caller=engine.go|caller=evaluator_local.go|caller=compat.go|scheduler_processor.go|tail.go|http.go|Error receiving response from grpc tail client|Error from iterator|reached tail max duration limit|context canceled|rpc error: code = Canceled|err=EOF|tail client|grpc tail client|client-side throttling|failed to register collector with remote server|remotecfg|noop client|memcache: no servers configured or available|failed to lookup SRV records)"
                  [5m]
                )
              ) > 0
            for: 2m
            labels:
              severity: critical
              source: loki
              component: logging
              category: observability
            annotations:
              summary: "Critical logging stack log detected"
              description: "Critical logging stack log detected in pod={{ $labels.pod }}, container={{ $labels.container }}."

          # ------------------------------------------------------------
          # CoreDNS critical only
          # ------------------------------------------------------------
          - alert: LokiCoreDNSCriticalLogsDetected
            expr: |
              sum by (namespace, pod, container) (
                count_over_time(
                  {namespace="kube-system", pod=~".*coredns.*"}
                  |~ "(?i)panic|fatal|plugin/errors.*SERVFAIL|no route to host|connection refused"
                  [5m]
                )
              ) > 5
            for: 5m
            labels:
              severity: critical
              source: loki
              component: coredns
              category: dns
            annotations:
              summary: "Critical CoreDNS log pattern detected"
              description: "Repeated critical CoreDNS log pattern detected in pod={{ $labels.pod }}, container={{ $labels.container }}."

          # ------------------------------------------------------------
          # Traefik 5xx burst only
          # ------------------------------------------------------------
          - alert: LokiTraefik5xxBurstDetected
            expr: |
              sum by (namespace, pod, container) (
                count_over_time(
                  {namespace="kube-system", pod=~".*traefik.*"}
                  |~ " 5[0-9][0-9] "
                  [10m]
                )
              ) > 20
            for: 5m
            labels:
              severity: critical
              source: loki
              component: traefik
              category: ingress
            annotations:
              summary: "Traefik HTTP 5xx burst detected"
              description: "More than 20 Traefik HTTP 5xx responses detected in pod={{ $labels.pod }}, container={{ $labels.container }} during the last 10 minutes."

          # ------------------------------------------------------------
          # External Secrets critical only
          # ------------------------------------------------------------
          - alert: LokiExternalSecretsCriticalLogsDetected
            expr: |
              sum by (namespace, pod, container) (
                count_over_time(
                  {namespace="external-secrets-system"}
                  |~ "(?i)panic|fatal|failed to start|invalid provider config|authentication failed|authorization failed|forbidden|unauthorized"
                  !~ "(?i)(source=loki_ruler|rule_type=alerting|evaluating rule|executing query|request timings|caller=metrics.go|caller=engine.go|caller=evaluator_local.go|caller=compat.go|context canceled|tail client|dashboard.grafana.app|/apis/dashboard.grafana.app|query=)"
                  [10m]
                )
              ) > 3
            for: 5m
            labels:
              severity: critical
              source: loki
              component: external-secrets
              category: secrets
            annotations:
              summary: "Critical External Secrets log detected"
              description: "Repeated critical External Secrets issue detected in pod={{ $labels.pod }}, container={{ $labels.container }}."
