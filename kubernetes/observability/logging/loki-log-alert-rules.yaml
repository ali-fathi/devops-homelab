apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-log-alert-rules
  namespace: logging

data:
  log-alerts.yaml: |
    groups:
      - name: critical-log-alerts
        interval: 1m

        rules:

          # ------------------------------------------------------------
          # Critical application logs
          # Excludes observability/system/debug namespaces to avoid spam.
          # ------------------------------------------------------------
          - alert: LokiCriticalApplicationLogsDetected
            expr: |
              sum by (namespace, pod, container) (
                count_over_time(
                  {
                    namespace!="",
                    namespace!="logging",
                    namespace!="monitoring",
                    namespace!="kube-system",
                    namespace!="longhorn-system",
                    namespace!="external-secrets-system",
                    pod!~".*netshoot.*|.*curl-test.*|.*debug.*|.*test.*"
                  }
                  |~ "(?i)critical|fatal|panic|segmentation fault|segfault|data corruption|corruption detected"
                  !~ "(source=loki_ruler|rule_type=alerting|executing query|request timings|caller=metrics.go|caller=engine.go|caller=evaluator_local.go|caller=compat.go|context canceled|tail client)"
                  [5m]
                )
              ) > 0
            for: 2m
            labels:
              severity: critical
              source: loki
              category: application
            annotations:
              summary: "Critical application log detected"
              description: "Critical/fatal/panic log detected in namespace={{ $labels.namespace }}, pod={{ $labels.pod }}, container={{ $labels.container }}."

          # ------------------------------------------------------------
          # OOM / memory exhaustion logs
          # ------------------------------------------------------------
          - alert: LokiOOMDetected
            expr: |
              sum by (namespace, pod, container) (
                count_over_time(
                  {
                    namespace!="",
                    pod!~".*netshoot.*|.*curl-test.*|.*debug.*|.*test.*"
                  }
                  |~ "(?i)oomkilled|out of memory|oom killer|memory cgroup out of memory|cannot allocate memory"
                  !~ "(source=loki_ruler|rule_type=alerting|executing query|request timings|context canceled|tail client)"
                  [5m]
                )
              ) > 0
            for: 1m
            labels:
              severity: critical
              source: loki
              category: kubernetes
            annotations:
              summary: "OOM or memory exhaustion detected"
              description: "OOM or memory exhaustion detected in namespace={{ $labels.namespace }}, pod={{ $labels.pod }}, container={{ $labels.container }}."

          # ------------------------------------------------------------
          # Longhorn critical storage issues only
          # ------------------------------------------------------------
          - alert: LokiLonghornCriticalStorageLogsDetected
            expr: |
              sum by (namespace, pod, container) (
                count_over_time(
                  {namespace="longhorn-system"}
                  |~ "(?i)volume .* degraded|volume .* faulted|replica .* failed|replica failure|failed to attach|failed to detach|disk pressure|no available disk|insufficient storage|filesystem is read-only|input/output error"
                  !~ "(source=loki_ruler|rule_type=alerting|executing query|request timings|context canceled|tail client)"
                  [5m]
                )
              ) > 0
            for: 2m
            labels:
              severity: critical
              source: loki
              component: longhorn
              category: storage
            annotations:
              summary: "Critical Longhorn storage log detected"
              description: "Critical Longhorn storage issue detected in pod={{ $labels.pod }}, container={{ $labels.container }}."

          # ------------------------------------------------------------
          # Grafana real critical logs only
          # Ignores level=info, status=400, query noise, plugin checker.
          # ------------------------------------------------------------
          - alert: LokiGrafanaCriticalLogsDetected
            expr: |
              sum by (namespace, pod, container) (
                count_over_time(
                  {namespace="monitoring", pod=~".*grafana.*"}
                  | logfmt
                  | level=~"error|fatal|panic"
                  [5m]
                )
              ) > 0
            for: 2m
            labels:
              severity: critical
              source: loki
              component: grafana
              category: observability
            annotations:
              summary: "Critical Grafana log detected"
              description: "Grafana emitted a real error/fatal/panic log in pod={{ $labels.pod }}, container={{ $labels.container }}."

          # ------------------------------------------------------------
          # Grafana HTTP 5xx only
          # Ignores 400/401/403/404 because those are often user/query errors.
          # ------------------------------------------------------------
          - alert: LokiGrafanaHTTP5xxDetected
            expr: |
              sum by (namespace, pod, container) (
                count_over_time(
                  {namespace="monitoring", pod=~".*grafana.*"}
                  |~ "status=5[0-9][0-9]"
                  [5m]
                )
              ) > 0
            for: 3m
            labels:
              severity: critical
              source: loki
              component: grafana
              category: observability
            annotations:
              summary: "Grafana HTTP 5xx detected"
              description: "Grafana returned HTTP 5xx in pod={{ $labels.pod }}, container={{ $labels.container }}."

          # ------------------------------------------------------------
          # Loki internal critical logs only
          # Excludes normal Loki ruler evaluation logs and tail cancellation noise.
          # ------------------------------------------------------------
          - alert: LokiInternalCriticalLogsDetected
            expr: |
              sum by (namespace, pod, container) (
                count_over_time(
                  {namespace="logging", pod=~".*loki.*"}
                  |~ "(?i)panic|fatal|critical|failed to start|out of space|permission denied|corruption"
                  !~ "(source=loki_ruler|rule_type=alerting|evaluating rule|executing query|request timings|caller=metrics.go|caller=engine.go|caller=evaluator_local.go|caller=compat.go|context canceled|tail client|grpc tail client)"
                  !~ "(memcache: no servers configured or available|failed to lookup SRV records)"
                  [5m]
                )
              ) > 0
            for: 2m
            labels:
              severity: critical
              source: loki
              component: loki
              category: observability
            annotations:
              summary: "Critical Loki internal log detected"
              description: "Critical Loki internal issue detected in pod={{ $labels.pod }}, container={{ $labels.container }}."

          # ------------------------------------------------------------
          # Grafana Alloy critical logs only
          # ------------------------------------------------------------
          - alert: LokiAlloyCriticalLogsDetected
            expr: |
              sum by (namespace, pod, container) (
                count_over_time(
                  {namespace="logging", pod=~".*alloy.*"}
                  |~ "(?i)panic|fatal|critical|failed to start|configuration error|invalid config"
                  !~ "(source=loki_ruler|rule_type=alerting|executing query|request timings|context canceled|tail client)"
                  [5m]
                )
              ) > 0
            for: 2m
            labels:
              severity: critical
              source: loki
              component: alloy
              category: observability
            annotations:
              summary: "Critical Grafana Alloy log detected"
              description: "Critical Alloy issue detected in pod={{ $labels.pod }}, container={{ $labels.container }}."

          # ------------------------------------------------------------
          # Logging namespace critical logs
          # Excludes Loki ruler evaluation logs and known non-critical noise.
          # ------------------------------------------------------------
          - alert: LokiLoggingStackCriticalLogsDetected
            expr: |
              sum by (namespace, pod, container) (
                count_over_time(
                  {namespace="logging"}
                  |~ "(?i)panic|fatal|critical|failed to start|corruption|out of space|permission denied"
                  !~ "(source=loki_ruler|rule_type=alerting|evaluating rule|executing query|request timings|caller=metrics.go|caller=engine.go|caller=evaluator_local.go|caller=compat.go|context canceled|tail client|grpc tail client)"
                  !~ "(memcache: no servers configured or available|failed to lookup SRV records)"
                  [5m]
                )
              ) > 0
            for: 2m
            labels:
              severity: critical
              source: loki
              component: logging
              category: observability
            annotations:
              summary: "Critical logging stack log detected"
              description: "Critical logging stack log detected in pod={{ $labels.pod }}, container={{ $labels.container }}."

          # ------------------------------------------------------------
          # CoreDNS critical only
          # DNS failures are important, but avoid generic error spam.
          # ------------------------------------------------------------
          - alert: LokiCoreDNSCriticalLogsDetected
            expr: |
              sum by (namespace, pod, container) (
                count_over_time(
                  {namespace="kube-system", pod=~".*coredns.*"}
                  |~ "(?i)panic|fatal|plugin/errors.*SERVFAIL|no route to host|connection refused"
                  [5m]
                )
              ) > 5
            for: 5m
            labels:
              severity: critical
              source: loki
              component: coredns
              category: dns
            annotations:
              summary: "Critical CoreDNS log pattern detected"
              description: "Repeated critical CoreDNS log pattern detected in pod={{ $labels.pod }}, container={{ $labels.container }}."

          # ------------------------------------------------------------
          # Traefik 5xx burst only
          # Ignores normal 404 and client-side errors.
          # ------------------------------------------------------------
          - alert: LokiTraefik5xxBurstDetected
            expr: |
              sum by (namespace, pod, container) (
                count_over_time(
                  {namespace="kube-system", pod=~".*traefik.*"}
                  |~ " 5[0-9][0-9] "
                  [10m]
                )
              ) > 20
            for: 5m
            labels:
              severity: critical
              source: loki
              component: traefik
              category: ingress
            annotations:
              summary: "Traefik HTTP 5xx burst detected"
              description: "More than 20 Traefik HTTP 5xx responses detected in pod={{ $labels.pod }}, container={{ $labels.container }} during the last 10 minutes."

          # ------------------------------------------------------------
          # External Secrets critical only
          # Excludes Loki's own ruler query text.
          # ------------------------------------------------------------
          - alert: LokiExternalSecretsCriticalLogsDetected
            expr: |
              sum by (namespace, pod, container) (
                count_over_time(
                  {namespace="external-secrets-system"}
                  |~ "(?i)panic|fatal|failed to start|invalid provider config|authentication failed|authorization failed|forbidden|unauthorized"
                  !~ "(source=loki_ruler|rule_type=alerting|evaluating rule|executing query|request timings|caller=metrics.go|caller=engine.go|caller=evaluator_local.go|caller=compat.go|context canceled|tail client)"
                  [10m]
                )
              ) > 3
            for: 5m
            labels:
              severity: critical
              source: loki
              component: external-secrets
              category: secrets
            annotations:
              summary: "Critical External Secrets log detected"
              description: "Repeated critical External Secrets issue detected in pod={{ $labels.pod }}, container={{ $labels.container }}."

          # ------------------------------------------------------------
          # Optional manual test rule.
          # Keep commented out unless actively testing Telegram.
          # ------------------------------------------------------------
          # - alert: LokiForcedTestAlert
          #   expr: |
          #     sum(
          #       count_over_time(
          #         {pod="loki-critical-test"}
          #         |= "fatal"
          #         [5m]
          #       )
          #     ) > 0
          #   labels:
          #     severity: critical
          #     source: loki
          #     test: "true"
          #   annotations:
          #     summary: "Forced Loki test alert"
          #     description: "Loki detected the test fatal log from pod loki-critical-test."