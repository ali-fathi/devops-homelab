alertmanager:
  enabled: true

  alertmanagerSpec:
    secrets:
      - telegram-alerts

  config:
    global:
      resolve_timeout: 5m

    route:
      # Send all explicitly classified warning/critical alerts to Telegram.
      # Alerts without a severity remain suppressed until they are reviewed.
      receiver: "null"

      group_by:
        - alertname
        - severity

      group_wait: 1m
      group_interval: 15m
      repeat_interval: 24h

      routes:
        - matchers:
            - alertname="Watchdog"
          receiver: "null"

        - matchers:
            - severity=~"critical|warning"
          receiver: telegram
          continue: false

    receivers:
      - name: telegram
        telegram_configs:
          - api_url: https://api.telegram.org
            bot_token_file: /etc/alertmanager/secrets/telegram-alerts/bot-token
            chat_id_file: /etc/alertmanager/secrets/telegram-alerts/chat-id
            send_resolved: true
            parse_mode: HTML
            message: |-
              {{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} <b>{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}</b>
              <b>Severity:</b> {{ .CommonLabels.severity }}
              {{ range .Alerts }}
              <b>{{ .Annotations.summary }}</b>
              {{ .Annotations.description }}
              {{- with .Labels.namespace }}
              <b>Namespace:</b> <code>{{ . }}</code>
              {{- end }}
              {{- with .Labels.pod }}
              <b>Pod:</b> <code>{{ . }}</code>
              {{- end }}
              {{- with .Labels.volume }}
              <b>Volume:</b> <code>{{ . }}</code>
              {{- end }}
              {{- with .Annotations.runbook_url }}
              <a href="{{ . }}">Runbook</a>
              {{- end }}
              {{ end }}

      - name: "null"
