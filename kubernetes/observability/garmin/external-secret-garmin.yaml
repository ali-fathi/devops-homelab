apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garmin-secrets
  namespace: garmin
spec:
  # Cost optimization:
  # Garmin credentials and InfluxDB credentials rarely change.
  # A 48h refresh avoids unnecessary Key Vault read operations.
  refreshInterval: 48h

  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore

  target:
    name: garmin-secrets
    creationPolicy: Owner

  data:
    - secretKey: GARMINCONNECT_EMAIL
      remoteRef:
        key: garmin-connect-email

    - secretKey: GARMINCONNECT_BASE64_PASSWORD
      remoteRef:
        key: garmin-connect-password-base64

    - secretKey: INFLUXDB_USERNAME
      remoteRef:
        key: garmin-influxdb-username

    - secretKey: INFLUXDB_PASSWORD
      remoteRef:
        key: garmin-influxdb-password