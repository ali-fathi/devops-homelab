apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: telegram-alerts
  namespace: monitoring

spec:
  # Telegram credentials are static. Refresh only on creation or an explicit
  # metadata/spec change, not on a periodic Key Vault poll.
  refreshPolicy: OnChange

  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore

  target:
    name: telegram-alerts

  data:
    - secretKey: bot-token
      remoteRef:
        key: telegram-bot-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: chat-id
      remoteRef:
        key: telegram-chat-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
