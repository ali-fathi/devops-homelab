apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: longhorn-alerts
  namespace: monitoring
  labels:
    release: monitoring
    app.kubernetes.io/name: longhorn-alerts
    app.kubernetes.io/component: storage-monitoring

spec:
  groups:
    - name: longhorn-alerts

      rules:

        - alert: LonghornVolumeDegraded
          # Longhorn exposes one-hot robustness series. Healthy is 1; the
          # alert fires once no manager reports the volume as healthy. The
          # max aggregation avoids one alert per Longhorn manager replica.
          expr: |
            max by (volume, pvc, pvc_namespace) (
              longhorn_volume_robustness{state="healthy"}
            ) == 0
          for: 5m

          labels:
            severity: critical

          annotations:
            summary: "Longhorn Volume Degraded"
            description: "Volume {{ $labels.volume }} is degraded."

        - alert: LonghornReplicaFailure
          expr: |
            longhorn_volume_number_of_replicas
            <
            longhorn_volume_spec_number_of_replicas
          for: 5m

          labels:
            severity: critical

          annotations:
            summary: "Longhorn Replica Failure"
            description: "Volume {{ $labels.volume }} has lost replicas."

        - alert: LonghornDiskPressure
          expr: |
            (
              longhorn_disk_usage_bytes
              /
              longhorn_disk_capacity_bytes
            ) * 100 > 90
          for: 10m

          labels:
            severity: critical

          annotations:
            summary: "Longhorn Disk Usage Above 90%"
            description: "Disk {{ $labels.disk }} usage is above 90%."
