grafana:
  # Important:
  # Grafana uses a Longhorn ReadWriteOnce PVC.
  # With the default RollingUpdate strategy, Kubernetes may start a new Grafana pod
  # before the old one releases the PVC, causing Multi-Attach errors.
  #
  # Recreate ensures the old Grafana pod is stopped first, the PVC is detached,
  # and only then the new Grafana pod starts.
  deploymentStrategy:
    type: Recreate

  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi

prometheus:
  prometheusSpec:
    # Temporary incident recovery: remove the active CSI ticket so Longhorn can
    # gracefully detach the stale worker2 engine. Remove after Detached is proven.
    replicas: 0
    retention: 30d

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn

          accessModes:
            - ReadWriteOnce

          resources:
            requests:
              storage: 20Gi

alertmanager:
  enabled: true

  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn

          accessModes:
            - ReadWriteOnce

          resources:
            requests:
              storage: 5Gi
