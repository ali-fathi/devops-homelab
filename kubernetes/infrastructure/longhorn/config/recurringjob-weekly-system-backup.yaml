apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly-system-backup-2week
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn-recurring-backup
    app.kubernetes.io/component: system-backup
spec:
  name: weekly-system-backup-2week
  task: system-backup
  cron: "30 1 * * SUN"
  retain: 2
  concurrency: 1
  labels: {}
  parameters:
    volume-backup-policy: if-not-present
