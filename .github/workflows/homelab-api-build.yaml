name: Build Homelab API Container

on:
  push:
    branches:
      - main
    paths:
      - "apps/homelab-api/**"
      - ".github/workflows/homelab-api-build.yaml"

  pull_request:
    paths:
      - "apps/homelab-api/**"
      - ".github/workflows/homelab-api-build.yaml"

  workflow_dispatch:

# Jobs must declare their own minimum token scope. The empty workflow default
# prevents a future job from inheriting the repository's write-capable default.
permissions: {}

concurrency:
  group: homelab-api-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, scan, and stage image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/homelab-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build container image
        run: |
          docker build \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --label org.opencontainers.image.title="homelab-api" \
            -t "${IMAGE_NAME}:${{ github.sha }}" \
            apps/homelab-api

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/homelab-api:${{ github.sha }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Save scanned image
        run: docker save --output /tmp/homelab-api-image.tar "${IMAGE_NAME}:${{ github.sha }}"

      - name: Upload scanned image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: homelab-api-image-${{ github.sha }}
          path: /tmp/homelab-api-image.tar
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish image to GHCR
    needs: build
    # Publishing occurs only for a reviewed commit that has reached main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/homelab-api

    steps:
      - name: Download scanned image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: homelab-api-image-${{ github.sha }}
          path: /tmp/image

      - name: Load scanned image
        run: docker load --input /tmp/image/homelab-api-image.tar

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Push immutable and latest image tags
        run: |
          docker tag "${IMAGE_NAME}:${{ github.sha }}" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${{ github.sha }}"
          docker push "${IMAGE_NAME}:latest"
