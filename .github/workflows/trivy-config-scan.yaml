name: Trivy Config Security Scan

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: trivy-config-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-config:
    name: Trivy configuration scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run Trivy configuration scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy-config-results.sarif
          exit-code: "0"
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-config-results.sarif
