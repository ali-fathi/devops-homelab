name: Build Health Dashboard Container

on:
  push:
    branches:
      - main
    paths:
      - "apps/health-dashboard/**"
      - ".github/workflows/health-dashboard-build.yaml"

  pull_request:
    paths:
      - "apps/health-dashboard/**"
      - ".github/workflows/health-dashboard-build.yaml"

  workflow_dispatch:

# Jobs must declare their own minimum token scope. The empty workflow default
# prevents a future job from inheriting the repository's write-capable default.
permissions: {}

concurrency:
  group: health-dashboard-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run application tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r apps/health-dashboard/requirements.txt

      - name: Run tests
        run: python -m unittest discover -s apps/health-dashboard/tests -v

  build:
    needs: test
    name: Build, scan, and stage image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/health-dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build container image
        run: |
          docker build \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --label org.opencontainers.image.title="health-dashboard" \
            -t "${IMAGE_NAME}:${{ github.sha }}" \
            apps/health-dashboard

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/health-dashboard:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Save scanned image
        run: docker save --output /tmp/health-dashboard-image.tar "${IMAGE_NAME}:${{ github.sha }}"

      - name: Upload scanned image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: health-dashboard-image-${{ github.sha }}
          path: /tmp/health-dashboard-image.tar
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish image to GHCR
    needs: build
    # Publishing occurs only for a reviewed commit that has reached main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/health-dashboard

    steps:
      - name: Download scanned image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: health-dashboard-image-${{ github.sha }}
          path: /tmp/image

      - name: Load scanned image
        run: docker load --input /tmp/image/health-dashboard-image.tar

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Push immutable and latest image tags and publish digest summary
        shell: bash
        run: |
          set -euo pipefail

          docker tag "${IMAGE_NAME}:${{ github.sha }}" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${{ github.sha }}" | tee /tmp/image-push.log
          docker push "${IMAGE_NAME}:latest"

          digest="$(sed -n 's/.*digest: \(sha256:[0-9a-f]*\).*/\1/p' /tmp/image-push.log | tail -n 1)"
          test -n "${digest}"
          echo "Published ${IMAGE_NAME}@${digest}"
          {
            echo "### Published Health Dashboard image"
            echo
            echo "\`${IMAGE_NAME}@${digest}\`"
            echo
            echo "Update kubernetes/applications/health-dashboard/kustomization.yaml in a reviewed GitOps PR to deploy this digest."
          } >> "${GITHUB_STEP_SUMMARY}"
