name: Build Health Dashboard Container

on:
  push:
    branches:
      - main
    paths:
      - "apps/health-dashboard/**"
      - ".github/workflows/health-dashboard-build.yaml"

  pull_request:
    paths:
      - "apps/health-dashboard/**"
      - ".github/workflows/health-dashboard-build.yaml"
      - "kubernetes/applications/health-dashboard/kustomization.yaml"

  workflow_dispatch:

# Jobs must declare their own minimum token scope. The empty workflow default
# prevents a future job from inheriting the repository's write-capable default.
permissions: {}

concurrency:
  group: health-dashboard-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run application tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r apps/health-dashboard/requirements.txt

      - name: Run tests
        run: python -m unittest discover -s apps/health-dashboard/tests -v

  build:
    needs: test
    name: Build, scan, and stage image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/health-dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build container image
        run: |
          docker build \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --label org.opencontainers.image.title="health-dashboard" \
            -t "${IMAGE_NAME}:${{ github.sha }}" \
            apps/health-dashboard

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/health-dashboard:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Save scanned image
        run: docker save --output /tmp/health-dashboard-image.tar "${IMAGE_NAME}:${{ github.sha }}"

      - name: Upload scanned image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: health-dashboard-image-${{ github.sha }}
          path: /tmp/health-dashboard-image.tar
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish image to GHCR
    needs: build
    # Publishing occurs only for a reviewed commit that has reached main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      digest: ${{ steps.publish-image.outputs.digest }}

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/health-dashboard

    steps:
      - name: Download scanned image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: health-dashboard-image-${{ github.sha }}
          path: /tmp/image

      - name: Load scanned image
        run: docker load --input /tmp/image/health-dashboard-image.tar

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Push immutable and latest image tags and publish digest summary
        id: publish-image
        shell: bash
        run: |
          set -euo pipefail

          docker tag "${IMAGE_NAME}:${{ github.sha }}" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${{ github.sha }}" | tee /tmp/image-push.log
          docker push "${IMAGE_NAME}:latest"

          digest="$(sed -n 's/.*digest: \(sha256:[0-9a-f]*\).*/\1/p' /tmp/image-push.log | tail -n 1)"
          test -n "${digest}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Published ${IMAGE_NAME}@${digest}"
          {
            echo "### Published Health Dashboard image"
            echo
            echo "\`${IMAGE_NAME}@${digest}\`"
            echo
            echo "GitHub Actions will create an immutable-digest GitOps PR automatically."
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy-pr:
    name: Create and auto-merge GitOps digest PR
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # This job uses a dedicated token so its branch and PR trigger the normal
    # pull_request checks. GITHUB_TOKEN-created PRs do not trigger new runs.
    permissions:
      contents: read
      pull-requests: read

    env:
      DEPLOY_TOKEN: ${{ secrets.HEALTH_DASHBOARD_DEPLOY_TOKEN }}
      DIGEST: ${{ needs.publish.outputs.digest }}
      KUSTOMIZATION: kubernetes/applications/health-dashboard/kustomization.yaml

    steps:
      - name: Check deployment token is configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_TOKEN}" ]]; then
            echo "::error::Configure the HEALTH_DASHBOARD_DEPLOY_TOKEN repository secret."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.HEALTH_DASHBOARD_DEPLOY_TOKEN }}

      - name: Update image digest
        shell: bash
        run: |
          set -euo pipefail
          DIGEST="${DIGEST}" python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["KUSTOMIZATION"])
          content = path.read_text(encoding="utf-8")
          digest = os.environ["DIGEST"]
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit(f"Invalid image digest: {digest!r}")
          updated, count = re.subn(
              r"(?m)^(\s*digest:\s*)sha256:[0-9a-f]{64}\s*$",
              rf"\g<1>{digest}",
              content,
          )
          if count != 1:
              raise SystemExit(f"Expected exactly one image digest, found {count}")
          if not updated.endswith("\n"):
              updated += "\n"
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Create digest PR and enable auto-merge
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HEALTH_DASHBOARD_DEPLOY_TOKEN }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/health-dashboard
        run: |
          set -euo pipefail
          branch="automation/health-dashboard-digest-${GITHUB_SHA::12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add "${KUSTOMIZATION}"
          if git diff --cached --quiet; then
            echo "The desired digest is already current; no PR is needed."
            exit 0
          fi
          git commit -m "chore(health-dashboard): deploy image ${GITHUB_SHA::12}"
          # A retry may find the branch left behind after a failed PR creation.
          # It is uniquely tied to this source commit, so replacing it is safe.
          git push --force origin "HEAD:${branch}"
          pr_url="$(gh pr list --head "${branch}" --state open --json url --jq '.[0].url // empty')"
          if [[ -z "${pr_url}" ]]; then
            pr_url="$(gh pr create \
              --base main \
              --head "${branch}" \
              --title "chore(health-dashboard): deploy image ${GITHUB_SHA::12}" \
              --body "$(printf 'Automated immutable image digest update for %s.\\n\\nImage: %s@%s\\n\\nRequired checks must pass before this PR is merged.\\n' "${GITHUB_SHA}" "${IMAGE_NAME}" "${DIGEST}")")"
          else
            echo "Reusing existing digest PR: ${pr_url}"
          fi
          gh pr merge "${pr_url}" --auto --squash --delete-branch
