name: Build Health Dashboard Container

on:
  push:
    branches:
      - main
    paths:
      - "apps/health-dashboard/**"
      - ".github/workflows/health-dashboard-build.yaml"

  pull_request:
    paths:
      - "apps/health-dashboard/**"
      - ".github/workflows/health-dashboard-build.yaml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: health-dashboard-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run application tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r apps/health-dashboard/requirements.txt

      - name: Run tests
        run: python -m unittest discover -s apps/health-dashboard/tests -v

  build:
    needs: test
    name: Build, scan, and publish image
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/health-dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build container image
        run: |
          docker build \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --label org.opencontainers.image.title="health-dashboard" \
            -t "${IMAGE_NAME}:${{ github.sha }}" \
            -t "${IMAGE_NAME}:latest" \
            apps/health-dashboard

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/health-dashboard:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Push container image and publish digest summary
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          docker push "${IMAGE_NAME}:${{ github.sha }}" | tee /tmp/image-push.log
          docker push "${IMAGE_NAME}:latest"

          digest="$(sed -n 's/.*digest: \(sha256:[0-9a-f]*\).*/\1/p' /tmp/image-push.log | tail -n 1)"
          test -n "${digest}"
          echo "Published ${IMAGE_NAME}@${digest}"
          {
            echo "### Published Health Dashboard image"
            echo
            echo "\`${IMAGE_NAME}@${digest}\`"
            echo
            echo "Update kubernetes/applications/health-dashboard/kustomization.yaml in a reviewed GitOps PR to deploy this digest."
          } >> "${GITHUB_STEP_SUMMARY}"
