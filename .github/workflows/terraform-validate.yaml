name: Terraform Validation

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-validate.yaml"
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-validate.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # needed to post the plan as a PR comment

jobs:
  terraform:
    name: Terraform fmt, validate, and plan
    # Cloud runner + Tailscale. The cloud runner cannot reach the cluster API
    # at 192.168.178.80:6443 (private LAN), so the tailscale/github-action joins
    # the tailnet and routes to the cluster through the homelab subnet router.
    # This keeps CI on GitHub's sandboxed runner (no self-hosted security risk
    # on a public repo) while reaching the cluster securely (WireGuard, E2E).
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: true

      # ─── Validation gate (always — no credentials needed) ────────────
      - name: Terraform fmt check
        id: fmt
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
        continue-on-error: false

      - name: Terraform init (no backend)
        id: init
        run: |
          set -euo pipefail
          terraform init -backend=false

      - name: Terraform validate
        id: validate
        run: |
          set -euo pipefail
          terraform validate

      - name: Terraform validate output
        if: steps.validate.outcome == 'failure'
        run: echo "::error::Terraform validation failed. Fix the reported issues and re-push."

      # ─── Plan gate (PR + manual only — read-only cluster access) ─────
      # Runs ONLY on pull_request or workflow_dispatch — NEVER push to main.
      # Uses the shared Azure backend + a read-only kubeconfig, reached via
      # Tailscale (the cloud runner joins the tailnet to reach 192.168.178.80).

      # Join the tailnet so the runner can reach the homelab cluster API.
      # Uses an auth key (Free-plan friendly) instead of an OAuth client.
      # Pin an explicit version (v1.102.2 = latest stable, 2026-08). Using
      # "stable" as the version broke the action's download+checksum step.
      - name: Connect to Tailscale
        id: tailscale
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci
          version: "1.102.2"

      - name: Terraform init (backend)
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          ARM_ACCESS_KEY: ${{ secrets.ARM_ACCESS_KEY }}
        run: |
          set -euo pipefail
          terraform init

      - name: Terraform plan (read-only)
        id: plan
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          ARM_ACCESS_KEY: ${{ secrets.ARM_ACCESS_KEY }}
          TF_VAR_kubeconfig_path: /tmp/kubeconfig-ci
        run: |
          set -euo pipefail

          # Decode the read-only kubeconfig from the GitHub secret
          echo "${{ secrets.KUBECONFIG_CI }}" | base64 -d > /tmp/kubeconfig-ci
          chmod 600 /tmp/kubeconfig-ci

          # -lock=false: CI plans are read-only and must NOT hold the state blob lease
          terraform plan -no-color -lock=false 2>&1 | tee plan.txt

          # Capture the plan output into a GitHub Actions output for the comment
          {
            echo "plan<<EOF"
            cat plan.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ─── Post the plan as a PR comment (tfcmt-style gate, simpler) ────
      # Only when running on a PR (context.issue.number exists). On
      # workflow_dispatch there is no PR to comment on — skip.
      - name: Post plan to PR
        if: github.event_name == 'pull_request' && steps.plan.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { repo, owner } = context.repo;
            const plan = `${{ steps.plan.outputs.plan }}`.slice(0, 60000);
            const body = `## Terraform Plan\n\n\`\`\`hcl\n${plan}\n\`\`\``;
            await github.rest.issues.createComment({
              owner, repo,
              issue_number: context.issue.number,
              body
            });
