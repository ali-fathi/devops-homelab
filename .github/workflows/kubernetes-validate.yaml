name: Kubernetes Manifest Validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yaml-lint:
    name: YAML syntax and style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: Run yamllint
        run: |
          yamllint kubernetes docs ansible .github

  kubeconform:
    name: Kubernetes schema validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Kubeconform
        uses: bmuschko/setup-kubeconform@v1

      - name: Build manifest file list
        shell: bash
        run: |
          set -euo pipefail

          find kubernetes -type f \( -name "*.yaml" -o -name "*.yml" \) \
            ! -name "values.yaml" \
            ! -name "values-*.yaml" \
            ! -name "*-values.yaml" \
            ! -path "*/docs/*" \
            ! -path "*/dashboards/*" \
            ! -path "*/grafana/*" \
            ! -path "kubernetes/infrastructure/metallb/metallb-native.yaml" \
            > /tmp/kubernetes-manifests.txt

          echo "Files selected for kubeconform:"
          cat /tmp/kubernetes-manifests.txt

          echo "Total files:"
          wc -l /tmp/kubernetes-manifests.txt

      - name: Validate Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s /tmp/kubernetes-manifests.txt ]; then
            echo "No Kubernetes manifests found for validation."
            exit 0
          fi

          kubeconform \
            -summary \
            -verbose \
            -strict \
            -ignore-missing-schemas \
            $(cat /tmp/kubernetes-manifests.txt)

  helm-render:
    name: Helm render validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.18.6

      - name: Add chart repositories
        shell: bash
        run: |
          set -euo pipefail
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update
          helm repo add grafana https://grafana.github.io/helm-charts --force-update
          helm repo update

      - name: Render pinned observability charts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/helm-rendered

          helm template monitoring prometheus-community/kube-prometheus-stack \
            --version 88.2.0 \
            --namespace monitoring \
            --include-crds \
            --values kubernetes/observability/monitoring/values.yaml \
            --values kubernetes/observability/alerting/values-alertmanager.yaml \
            > /tmp/helm-rendered/monitoring.yaml

          helm template loki grafana/loki \
            --version 7.2.0 \
            --namespace logging \
            --values kubernetes/observability/logging/loki-values.yaml \
            > /tmp/helm-rendered/loki.yaml

          helm template alloy grafana/alloy \
            --version 1.11.1 \
            --namespace logging \
            --values kubernetes/observability/logging/alloy-values.yaml \
            > /tmp/helm-rendered/alloy.yaml

          for manifest in /tmp/helm-rendered/*.yaml; do
            test -s "$manifest"
            printf '%s: ' "$(basename "$manifest")"
            grep -c '^kind:' "$manifest"
          done
