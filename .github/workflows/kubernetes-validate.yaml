name: Kubernetes Manifest Validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yaml-lint:
    name: YAML syntax and style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: Run yamllint
        run: |
          yamllint kubernetes docs ansible .github

  workflow-permissions:
    name: Workflow least-privilege validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require explicit workflow token permissions
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          while IFS= read -r workflow; do
            if ! grep -q '^permissions:' "$workflow"; then
              missing+=("$workflow")
            fi
          done < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yaml' -o -name '*.yml' \) -print | sort)

          if ((${#missing[@]} > 0)); then
            printf '::error::Workflow(s) missing an explicit top-level permissions block:\n' >&2
            printf '%s\n' "${missing[@]}" >&2
            exit 1
          fi

          if rg -n '^permissions:\s*(read-all|write-all)\s*$' .github/workflows; then
            echo '::error::Do not use read-all or write-all; declare only the required scopes.' >&2
            exit 1
          fi

          echo "[PASS] Every workflow declares explicit token permissions."

  kubeconform:
    name: Kubernetes schema validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Kubeconform
        uses: bmuschko/setup-kubeconform@e5d264ec1eafe2314e750c429a9da7639dd5a003 # v1

      - name: Build manifest file list
        shell: bash
        run: |
          set -euo pipefail

          find kubernetes -type f \( -name "*.yaml" -o -name "*.yml" \) \
            ! -name "values.yaml" \
            ! -name "values-*.yaml" \
            ! -name "*-values.yaml" \
            ! -path "*/docs/*" \
            ! -path "*/dashboards/*" \
            ! -path "*/grafana/*" \
            ! -path "kubernetes/infrastructure/metallb/metallb-native.yaml" \
            > /tmp/kubernetes-manifests.txt

          echo "Files selected for kubeconform:"
          cat /tmp/kubernetes-manifests.txt

          echo "Total files:"
          wc -l /tmp/kubernetes-manifests.txt

      - name: Validate Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s /tmp/kubernetes-manifests.txt ]; then
            echo "No Kubernetes manifests found for validation."
            exit 0
          fi

          kubeconform \
            -summary \
            -verbose \
            -strict \
            -ignore-missing-schemas \
            $(cat /tmp/kubernetes-manifests.txt)

  helm-render:
    name: Helm render validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.18.6

      - name: Add chart repositories
        shell: bash
        run: |
          set -euo pipefail
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update
          helm repo add grafana https://grafana.github.io/helm-charts --force-update
          helm repo update

      - name: Render pinned observability charts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/helm-rendered

          helm template monitoring prometheus-community/kube-prometheus-stack \
            --version 88.2.0 \
            --namespace monitoring \
            --include-crds \
            --values kubernetes/observability/monitoring/values.yaml \
            --values kubernetes/observability/alerting/values-alertmanager.yaml \
            > /tmp/helm-rendered/monitoring.yaml

          helm template loki grafana/loki \
            --version 7.2.0 \
            --namespace logging \
            --values kubernetes/observability/logging/loki-values.yaml \
            > /tmp/helm-rendered/loki.yaml

          helm template alloy grafana/alloy \
            --version 1.11.1 \
            --namespace logging \
            --values kubernetes/observability/logging/alloy-values.yaml \
            > /tmp/helm-rendered/alloy.yaml

          for manifest in /tmp/helm-rendered/*.yaml; do
            test -s "$manifest"
            printf '%s: ' "$(basename "$manifest")"
            grep -c '^kind:' "$manifest"
          done
