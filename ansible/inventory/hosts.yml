---
# Ansible inventory — YAML format
# Converted from hosts.ini (INI) to hosts.yml (YAML).
#
# Group structure (matches the original hosts.ini):
#
#   k3s_cluster  (parent group)
#      ├── k3s_master   →  k3s-master    (192.168.178.80)
#      └── k3s_workers  →  k3s-worker1   (192.168.178.81)
#                         k3s-worker2    (192.168.178.82)
#
# Node-level variables (ansible_user, ssh key, become, python)
# live in group_vars/k3s_cluster.yml — inherited by every host here.

all:
  children:
    k3s_cluster:
      children:
        k3s_master:
          hosts:
            k3s-master:
              ansible_host: 192.168.178.80
        k3s_workers:
          hosts:
            k3s-worker1:
              ansible_host: 192.168.178.81
            k3s-worker2:
              ansible_host: 192.168.178.82
