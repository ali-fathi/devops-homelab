---
# Ansible inventory — YAML format
# Converted from hosts.ini (INI) to hosts.yml (YAML).
#
# Group structure (matches the original hosts.ini):
#
#   k3s_cluster  (parent group)
#      ├── k3s_control_plane
#      │   ├── k3s_master             → k3s-master  (192.168.178.80)
#      │   └── k3s_new_control_plane → k3s-master2 (192.168.178.83)
#      │                               k3s-master3 (192.168.178.84)
#      └── k3s_workers                → k3s-worker1 (192.168.178.81)
#                                      k3s-worker2 (192.168.178.82)
#
# k3s_master deliberately remains the original server-only group for bootstrap
# token reads and other primary-server operations. HA-sensitive server changes
# such as the NetworkPolicy-controller remediation target k3s_control_plane
# sequentially. New servers inherit k3s_cluster settings after the one-time
# Ansible-user bootstrap playbook completes.

all:
  children:
    k3s_cluster:
      children:
        k3s_control_plane:
          children:
            k3s_master:
              hosts:
                k3s-master:
                  ansible_host: 192.168.178.80
            k3s_new_control_plane:
              hosts:
                k3s-master2:
                  ansible_host: 192.168.178.83
                k3s-master3:
                  ansible_host: 192.168.178.84
        k3s_workers:
          hosts:
            k3s-worker1:
              ansible_host: 192.168.178.81
            k3s-worker2:
              ansible_host: 192.168.178.82
